stages:
  data_ingestion:
    cmd: python scripts/download_bigvul.py
    deps:
    - scripts/download_bigvul.py
    outs:
    - data/bigvul.csv

  extract_subset:
    cmd: python -m graph_vul.pipeline.extract_subset --input data/bigvul.csv 
      --output data/subset.csv --manifest data/subset_manifest.json --report 
      data/subset_report.md
    deps:
    - data/bigvul.csv
    - graph_vul/pipeline/extract_subset.py
    - graph_vul/config.py
    outs:
    - data/subset.csv
    - data/subset_manifest.json
    - data/subset_report.md

  # joern_export:
  #   cmd: python -m graph_vul.pipeline.joern_export --input data/subset.csv --output data/raw
  #   deps:
  #     - data/subset.csv
  #     - graph_vul/pipeline/joern_export.py
  #   outs:
  #     - data/raw

  # embed_code:
  #   cmd: python -m graph_vul.pipeline.embed_code --input data/raw --output data/processed/code_embeddings --subset-csv data/subset.csv
  #   deps:
  #     - data/raw
  #     - data/subset.csv
  #     - graph_vul/pipeline/embed_code.py
  #     - graph_vul/pipeline/embed_utils.py
  #   outs:
  #     - data/processed/code_embeddings

  embed_cwe:
    cmd: python -m graph_vul.pipeline.embed_cwe --input 
      data/cwe_descriptions.json --output data/processed/cwe_embeddings
    deps:
    - data/cwe_descriptions.json
    - graph_vul/pipeline/embed_cwe.py
    - graph_vul/pipeline/embed_utils.py
    outs:
    - data/processed/cwe_embeddings

  split_data:
    cmd: python -m graph_vul.pipeline.split_data --input data/subset.csv 
      --output data/splits --seed 42
    deps:
    - data/subset.csv
    - graph_vul/pipeline/split_data.py
    outs:
    - data/splits

  # train:
  #   cmd: python -m graph_vul.train --epochs 35 --batch-size 32 --lr 1e-5 --seed 42
  #   deps:
  #     - data/processed/code_embeddings
  #     - data/processed/cwe_embeddings
  #     - data/splits
  #     - graph_vul/train.py
  #     - graph_vul/dataset/cpg_dataset.py
  #     - graph_vul/model/
  #   outs:
  #     - data/best_model.ckpt
  #   metrics:
  #     - data/metrics.json:
  #         cache: false

  func_extract_subset:
    cmd: python -m graph_vul.pipeline.func_extract_subset
    deps:
    - data/bigvul.csv
    - graph_vul/pipeline/func_extract_subset.py
    - graph_vul/config.py
    outs:
    - data/func_subset.csv
    - data/func_subset_manifest.json
    - data/func_subset_report.md

  func_embed:
    cmd: python -m graph_vul.pipeline.embed_functions
    deps:
    - data/func_subset.csv
    - graph_vul/pipeline/embed_functions.py
    - graph_vul/pipeline/embed_utils.py
    outs:
    - data/processed/func_embeddings

  func_split:
    cmd: python -m graph_vul.pipeline.split_data --input data/func_subset.csv 
      --output data/func_splits
    deps:
    - data/func_subset.csv
    - graph_vul/pipeline/split_data.py
    outs:
    - data/func_splits
    
  func_finetune:
    cmd: python -m graph_vul.train_finetune
    deps:
    - data/func_subset.csv
    - data/processed/cwe_embeddings
    - data/func_splits
    - graph_vul/train_finetune.py
    - graph_vul/dataset/func_finetune_dataset.py
    - graph_vul/model/func_finetune_model.py
    - graph_vul/model/func_finetune_lit_module.py
    outs:
    - data/func_finetune_model.ckpt
    metrics:
    - data/func_finetune_metrics.json:
        cache: false
