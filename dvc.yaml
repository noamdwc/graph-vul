stages:
  data_ingestion:
    cmd: python scripts/download_bigvul.py
    deps:
      - scripts/download_bigvul.py
    outs:
      - data/bigvul.csv

  extract_subset:
    cmd: python -m graph_vul.pipeline.extract_subset --input data/bigvul.csv --output data/subset.csv --manifest data/subset_manifest.json --report data/subset_report.md
    deps:
      - data/bigvul.csv
      - graph_vul/pipeline/extract_subset.py
      - graph_vul/config.py
    outs:
      - data/subset.csv
      - data/subset_manifest.json
      - data/subset_report.md

  joern_export:
    cmd: python -m graph_vul.pipeline.joern_export --input data/subset.csv --output data/raw
    deps:
      - data/subset.csv
      - graph_vul/pipeline/joern_export.py
    outs:
      - data/raw

  embed_code:
    cmd: python -m graph_vul.pipeline.embed_code --input data/raw --output data/processed/code_embeddings --subset-csv data/subset.csv
    deps:
      - data/raw
      - data/subset.csv
      - graph_vul/pipeline/embed_code.py
      - graph_vul/pipeline/embed_utils.py
    outs:
      - data/processed/code_embeddings

  embed_cve:
    cmd: python -m graph_vul.pipeline.embed_cve --input data/subset.csv --output data/processed/cve_embeddings
    deps:
      - data/subset.csv
      - graph_vul/pipeline/embed_cve.py
      - graph_vul/pipeline/embed_utils.py
    outs:
      - data/processed/cve_embeddings

  split_data:
    cmd: python -m graph_vul.pipeline.split_data --input data/subset.csv --output data/splits --seed 42
    deps:
      - data/subset.csv
      - graph_vul/pipeline/split_data.py
    outs:
      - data/splits

  train:
    cmd: python -m graph_vul.train --epochs 35 --batch-size 32 --lr 1e-4 --seed 42
    deps:
      - data/processed/code_embeddings
      - data/processed/cve_embeddings
      - data/splits
      - graph_vul/train.py
      - graph_vul/dataset/cpg_dataset.py
      - graph_vul/model/
    outs:
      - data/best_model.ckpt
    metrics:
      - data/metrics.json:
          cache: false
