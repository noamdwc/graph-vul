  #     - data/best_model.ckpt
  #   metrics:
  #     - data/metrics.json:
  #         cache: false

  func_extract_subset:
    cmd: python -m graph_vul.pipeline.func_extract_subset
    deps:
    - graph_vul/pipeline/func_extract_subset.py
    - graph_vul/dataset/primevul_adapter.py
    - graph_vul/config.py
    outs:
    - data/func_subset.csv
    - data/func_subset_manifest.json
    - data/func_subset_report.md

  # func_embed:
  #   cmd: python -m graph_vul.pipeline.embed_functions
  #   deps:
  #   - data/func_subset.csv
  #   - graph_vul/pipeline/embed_functions.py
  #   - graph_vul/pipeline/embed_utils.py
  #   outs:
  #   - data/processed/func_embeddings

  func_split:
    cmd: python -m graph_vul.pipeline.split_data --input data/func_subset.csv
      --output data/func_splits --split-mode project_disjoint
    deps:
    - data/func_subset.csv
    - graph_vul/pipeline/split_data.py
    outs:
    - data/func_splits

  partition_by_length:
    cmd: python -m graph_vul.pipeline.partition_by_length --input data/func_subset.csv
      --output-dir data/partitions
    deps:
    - data/func_subset.csv
    - graph_vul/pipeline/partition_by_length.py
    - graph_vul/config.py
    outs:
    - data/partitions/short/func_subset.csv
    - data/partitions/other/func_subset.csv

  func_split_short:
    cmd: python -m graph_vul.pipeline.split_data --input data/partitions/short/func_subset.csv
      --output data/partitions/short/splits --split-mode project_disjoint
    deps:
    - data/partitions/short/func_subset.csv
    - graph_vul/pipeline/split_data.py
    - graph_vul/config.py
    outs:
    - data/partitions/short/splits

  func_split_other:
    cmd: python -m graph_vul.pipeline.split_data --input data/partitions/other/func_subset.csv
      --output data/partitions/other/splits --split-mode project_disjoint
    deps:
    - data/partitions/other/func_subset.csv
    - graph_vul/pipeline/split_data.py
    - graph_vul/config.py
    outs:
    - data/partitions/other/splits
    
  func_finetune:
    cmd: python -m graph_vul.train_finetune --ablation-mode E0
    deps:
    - data/func_subset.csv
    - data/processed/cwe_embeddings
    - data/func_splits
    - graph_vul/train_finetune.py
    - graph_vul/dataset/func_finetune_dataset.py
    - graph_vul/model/func_finetune_model.py
    - graph_vul/model/func_finetune_lit_module.py
    - graph_vul/model/cwe_matching.py
    outs:
    - data/func_finetune_model.ckpt
    metrics:
    - data/func_finetune_metrics.json:
        cache: false

  func_export_predictions:
    cmd: python -m graph_vul.export_finetune_predictions --checkpoint data/func_finetune_model.ckpt --output-dir data/analysis/func_finetune_predictions
    deps:
    - data/func_subset.csv
    - data/processed/cwe_embeddings
    - data/func_splits
    - data/func_finetune_model.ckpt
    - graph_vul/export_finetune_predictions.py
    - graph_vul/analysis/cwe_matching_report.py
    - graph_vul/dataset/func_finetune_dataset.py
    - graph_vul/model/func_finetune_model.py
    - graph_vul/model/func_finetune_lit_module.py
    - graph_vul/model/cwe_matching.py
    outs:
    - data/analysis/func_finetune_predictions

  eval_external_tier1:
    cmd: python -m graph_vul.eval_external
    deps:
    - data/func_finetune_model.ckpt
    - data/processed/cwe_embeddings
    - graph_vul/eval_external.py
    - graph_vul/analysis/cwe_matching_report.py
    - graph_vul/dataset/external_datasets.py
    - graph_vul/model/cwe_matching.py
    outs:
    - data/analysis/external_eval_tier1

  post_experiment_analysis:
    cmd: jupyter nbconvert --to pdf --execute --output-dir outputs
      notebooks/post_experiment_analysis.ipynb
    deps:
    - data/analysis/func_finetune_predictions
    - notebooks/post_experiment_analysis.ipynb
    outs:
    - outputs/post_experiment_analysis.pdf
