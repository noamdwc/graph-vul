  func_treesitter_graphs:
    cmd: python -m graph_vul.pipeline.treesitter_graphs --input data/func_subset.csv --output data/processed/graph_artifacts
    deps:
      - data/func_subset.csv
      - graph_vul/pipeline/treesitter_graphs.py
      - graph_vul/config.py
    outs:
      - data/processed/graph_artifacts

  embed_cwe:
    cmd: python -m graph_vul.pipeline.embed_cwe --input 
      data/cwe_descriptions.json --output data/processed/cwe_embeddings
    deps:
    - data/cwe_descriptions.json
    - graph_vul/pipeline/embed_cwe.py
    - graph_vul/pipeline/embed_utils.py
    outs:
    - data/processed/cwe_embeddings

  # split_data:
  #   cmd: python -m graph_vul.pipeline.split_data --input data/subset.csv 
  #     --output data/splits --seed 42
  #   deps:
  #   - data/subset.csv
  #   - graph_vul/pipeline/split_data.py
  #   outs:
  #   - data/splits

  # train:
  #   cmd: python -m graph_vul.train --epochs 35 --batch-size 32 --lr 1e-5 --seed 42
  #   deps:
  #     - data/processed/code_embeddings
  #     - data/processed/cwe_embeddings
