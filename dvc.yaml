stages:
  prepare_matching:
    cmd: python -m graph_vul.pipeline.prepare_matching --output-dir data/interview-v1 --dataset-revision 4fd7158322872d711e90f091dbd8673ef32cb1be
    deps:
      - graph_vul/pipeline/prepare_matching.py
      - graph_vul/pipeline/func_extract_subset.py
      - graph_vul/pipeline/split_data.py
      - graph_vul/pipeline/treesitter_graphs.py
      - graph_vul/dataset/primevul_adapter.py
      - graph_vul/model/cwe_matching.py
      - graph_vul/config.py
      - configs/cwe_catalog_v1.json
    outs:
      - data/interview-v1/normalized.csv
      - data/interview-v1/unknown_cwe_vulnerable.csv
      - data/interview-v1/subset.csv
      - data/interview-v1/subset_manifest.json
      - data/interview-v1/subset_report.md
      - data/interview-v1/preparation.json
      - data/interview-v1/splits
      - data/interview-v1/graphs
  embed_cwe:
    cmd: python -m graph_vul.pipeline.embed_cwe --input configs/cwe_catalog_v1.json --output data/interview-v1/cwe_embeddings
    deps:
      - data/interview-v1/preparation.json
      - configs/cwe_catalog_v1.json
      - graph_vul/pipeline/embed_cwe.py
      - graph_vul/pipeline/embed_utils.py
    outs:
      - data/interview-v1/cwe_embeddings
  matching_matrix:
    cmd: python -m scripts.run_matching_matrix --data-root data/interview-v1 --output-dir data/matrix-v1
    deps:
      - data/interview-v1/preparation.json
      - data/interview-v1/subset.csv
      - data/interview-v1/splits
      - data/interview-v1/graphs
      - data/interview-v1/cwe_embeddings
      - graph_vul/model
      - graph_vul/train_finetune.py
      - graph_vul/inference.py
      - graph_vul/artifacts.py
      - graph_vul/export_finetune_predictions.py
      - graph_vul/eval_external.py
      - graph_vul/dataset/external_datasets.py
      - graph_vul/dataset/func_finetune_dataset.py
      - graph_vul/analysis/cwe_matching_report.py
      - scripts/run_matching_matrix.py
    outs:
      - data/matrix-v1
